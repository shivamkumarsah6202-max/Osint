# One-command run:  docker compose up
# Then open http://localhost:8080
services:
  numint:
    build: .
    image: numint:latest
    ports:
      - "8080:8080"
    environment:
      # Uncomment / set the keys you have. All are optional - the tool works
      # with none configured (offline baseline).
      - NUMVERIFY_API_KEY=${NUMVERIFY_API_KEY:-}
      - VERIPHONE_API_KEY=${VERIPHONE_API_KEY:-}
      - ABSTRACTAPI_API_KEY=${ABSTRACTAPI_API_KEY:-}
      - NUMLOOKUPAPI_API_KEY=${NUMLOOKUPAPI_API_KEY:-}
      - IPQS_API_KEY=${IPQS_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
