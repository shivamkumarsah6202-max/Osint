[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numint"
version = "0.1.0"
description = "Professional phone number OSINT & intelligence tool (CLI-first, with optional web UI and AI layer). Authorized use only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Numint contributors" }]
keywords = ["osint", "phone", "intelligence", "security", "cli", "phonenumbers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "phonenumbers>=8.13",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "diskcache>=5.6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
pdf = ["reportlab>=4.1"]
discord = ["discord.py>=2.3"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
]
all = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "reportlab>=4.1",
  "discord.py>=2.3",
]

[project.urls]
Homepage = "https://github.com/whoamitang/numint"
Repository = "https://github.com/whoamitang/numint"
Issues = "https://github.com/whoamitang/numint/issues"

[project.scripts]
numint = "numint.cli:app"

[tool.hatch.build.targets.wheel]
# Non-Python files inside the package (web/static/*, data/*) are bundled
# automatically by hatchling, so the web UI works right after `pip install`.
packages = ["src/numint"]
artifacts = ["src/numint/web/static/*", "src/numint/data/*"]

[tool.hatch.build.targets.sdist]
include = ["src/numint", "README.md", "LICENSE", ".env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer uses function-call defaults by design
